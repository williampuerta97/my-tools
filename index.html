<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8fb4ff">
  <link rel="icon" href="./icon-192.png">
  <title>Mis herramientas</title>
  <script>
    try {
      if (localStorage.getItem("finanzasTheme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (_) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg-start: #8fb4ff;
      --bg-end: #e0e0e0;
      --surface: #ffffff;
      --text: #1a1f2e;
      --icon-bg: #8fb4ff;
      --shadow: 0 10px 30px rgba(0,0,0,0.2);
      --toggle-bg: #f0f2f7;
      --toggle-hover: #e4e7ef;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-start: #1b2540;
      --bg-end: #0f131b;
      --surface: #1c212c;
      --text: #e7ebf3;
      --icon-bg: #3d5fa8;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --toggle-bg: #262c39;
      --toggle-hover: #313849;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .phone {
      position: relative;
      width: 320px;
      height: 600px;
      background: var(--surface);
      border-radius: 25px;
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin: 28px 0 20px;
    }

    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--toggle-bg);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--toggle-hover);
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text);
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      background: var(--icon-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: white;
      margin-bottom: 5px;
      transition: transform 0.2s;
    }

    .icon:hover {
      transform: scale(1.1);
    }

    .label {
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 400px) {
      .phone {
        width: 100%;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        padding-top: calc(20px + env(safe-area-inset-top));
      }
      .theme-toggle {
        top: calc(18px + env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>

<div class="phone">
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Cambiar tema"></button>
  <h1>Mis herramientas</h1>

  <div class="apps">

    <a href="simulador_credito_abonos.html" class="app">
      <div class="icon">💳</div>
      <div class="label">Simulador Crédito</div>
    </a>

    <a href="app_finanzas_personales_mensuales.html" class="app">
      <div class="icon">📊</div>
      <div class="label">Finanzas Mensuales</div>
    </a>

  </div>
</div>
<script>
  const THEME_KEY = "finanzasTheme";
  const themeBtn = document.getElementById("themeToggle");
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function applyTheme(dark) {
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = dark ? "☀️" : "🌙";
    themeBtn.setAttribute("aria-label", dark ? "Usar tema claro" : "Usar tema oscuro");
    if (themeMeta) themeMeta.setAttribute("content", dark ? "#1b2540" : "#8fb4ff");
  }

  applyTheme(document.documentElement.getAttribute("data-theme") === "dark");

  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") !== "dark";
    applyTheme(dark);
    localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
  });

  window.addEventListener("pageshow", () => {
    applyTheme(localStorage.getItem(THEME_KEY) === "dark");
  });

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(err => {
      console.error('ERROR SW:', err);
    });
  }
</script>
</body>
</html>
